  downloadSpeciesData:
    cmd: python scripts/downloadSpeciesData.py ${downloadSpeciesData.output_dir}
    deps:
    - scripts/downloadSpeciesData.py
    outs:
    - ${downloadSpeciesData.output_dir}
    params:
    - downloadSpeciesData

  isolate3UTRs:
    cmd: python scripts/isolate3UTRs.py --params params.yaml --data_dir ${downloadSpeciesData.output_dir}
    deps:
    - scripts/isolate3UTRs.py
    - ${downloadSpeciesData.output_dir}
    outs:
    - ${isolate3UTRs.output_dir}
    params:
    - isolate3UTRs

  preprocessFlyUTRs:
    cmd: python scripts/preprocessFlyUTRs.py --params params.yaml --data_dir ${isolate3UTRs.output_dir}
    deps:
    - scripts/preprocessFlyUTRs.py
    - ${isolate3UTRs.output_dir}
    outs:
    - ${preprocessFlyUTRs.output_dir} #output/data/flyUTRs
    params:
    - preprocessFlyUTRs

  trainToFlyUTRs:
    cmd: python scripts/trainToFlyUTRs.py --params params.yaml --data_dir ${preprocessFlyUTRs.output_dir}
    deps:
    - scripts/trainToFlyUTRs.py
    - ${preprocessFlyUTRs.output_dir}
    - data/4-new-12w-0/pytorch_model.bin
    outs:
    - ${trainToFlyUTRs.output_dir}/pytorch_model.bin
    - ${trainToFlyUTRs.output_dir}/checkpoints
    - ${trainToFlyUTRs.output_dir}/best_checkpoint
    params:
    - trainToFlyUTRs

  mergeUTRsAndDecayRates:
    cmd: python scripts/mergeUTRsAndDecayRates.py --params params.yaml --fasta ${preprocessFlyUTRs.output_dir}
      --gtf_file 
      ${downloadSpeciesData.output_dir}/Drosophila_melanogaster-GCA_000001215.4-2022_07-genes.gtf.gz
    deps:
    - scripts/mergeUTRsAndDecayRates.py
    - ${mergeUTRsAndDecayRates.decay_rates} #data/results_zygotic_tr_extended_filtered.csv
    - ${preprocessFlyUTRs.output_dir}
    outs:
    - ${mergeUTRsAndDecayRates.output_file} #output/data/utrDecayRates.fasta
    params:
    - mergeUTRsAndDecayRates

  isolateFullTranscripts:
    cmd: python scripts/isolateFullTranscripts.py --params params.yaml --data_dir
      ${isolate3UTRs.output_dir} --target_ids_fasta ${mergeUTRsAndDecayRates.output_file}
    deps:
    - scripts/isolateFullTranscripts.py
    - ${mergeUTRsAndDecayRates.output_file}
    - ${downloadSpeciesData.output_dir}
    outs:
    - ${isolateFullTranscripts.output_file}
    params:
    - isolateFullTranscripts

  getDecayResiduals:
    cmd: python scripts/getDecayResiduals.py --params params.yaml --decay_file ${mergeUTRsAndDecayRates.decay_rates}
      --utr_fasta ${mergeUTRsAndDecayRates.output_file} --CDS_fasta ${isolate3UTRs.output_dir}/Drosophila_melanogaster-cds.fa
    deps:
    - scripts/getDecayResiduals.py
    - ${isolate3UTRs.output_dir}/Drosophila_melanogaster-cds.fa
    - ${mergeUTRsAndDecayRates.output_file} #output/data/utrDecayRates.fasta
    outs:
    - ${getDecayResiduals.residuals}
    - ${getDecayResiduals.extraFeatures}
    params:
    - getDecayResiduals

  runViennaRNA:
    cmd: python scripts/runViennaRNA.py --input_fasta ${isolateFullTranscripts.output_file}
      --output_csv ${runViennaRNA.output_csv} --condaPath ${runViennaRNA.condaPath}
      --condaEnv inseq --RNAfold_path linearfold                                                                                                                                                                                                                                                                                                                                      #$( which RNAfold )
    deps:
    - scripts/runViennaRNA.py
    - ${isolateFullTranscripts.output_file} #output/data/utrDecayRates.fasta
    outs:
    - ${runViennaRNA.output_csv}
    params:
    - runViennaRNA

  preprocessData:
    cmd: python scripts/preprocess.py --params params.yaml --data_dir ${mergeUTRsAndDecayRates.output_file}
      --ncbi_geneID_map ${preprocessFlyUTRs.ncbi_geneID_map} --geneID_flybase_map
      ${preprocessFlyUTRs.geneID_flybase_map}                                                                                                                                                                                   #${getDecayResiduals.residuals} #
    deps:
    - scripts/preprocess.py
    - ${mergeUTRsAndDecayRates.output_file} #${getDecayResiduals.residuals} #
    outs:
    - ${preprocessData.output_dir}
    params:
    - preprocessData
    - preprocessFlyUTRs

  fineTuneModel:
    cmd: python scripts/train.py --params params.yaml --model_name_or_path ${trainToFlyUTRs.output_dir}/best_checkpoint/
      --max_seq_length 512 --data_dir ${preprocessData.output_dir} --extraFeatures
      ${getDecayResiduals.extraFeatures} --mfe ${runViennaRNA.output_csv}
    deps:
    - scripts/train.py
    - scripts/GenaLMWithExtraFeatures.py
    - ${preprocessData.output_dir}
    - ${trainToFlyUTRs.output_dir}/best_checkpoint
    - ${getDecayResiduals.extraFeatures}
    - ${runViennaRNA.output_csv}
    outs:
    - ${fineTuneModel.output_dir}:
        persist: true
    # - ${preprocessData.output_dir}_cache
    params:
    - fineTuneModel
    - modelParams

  ablate_features:
    foreach:
    - lengths
    - gc_content
    - codons
    do:
      cmd: python scripts/ablate_features.py --input_file ${getDecayResiduals.extraFeatures}
        --output_file ${ablate_features.output_dir}/no_${item}.csv --ablate_${item}
      deps:
      - scripts/ablate_features.py
      - ${getDecayResiduals.extraFeatures}
      outs:
      - ${ablate_features.output_dir}/no_${item}.csv
      params:
      - ablate_features

  fineTuneModel_ablations:
    foreach:
    - name: no_mfe
      extra_features: ${getDecayResiduals.extraFeatures}
      mfe_flag: ''
    - name: no_lengths
      extra_features: ${ablate_features.output_dir}/no_lengths.csv
      mfe_flag: --mfe ${runViennaRNA.output_csv}
    - name: no_gc_content
      extra_features: ${ablate_features.output_dir}/no_gc_content.csv
      mfe_flag: --mfe ${runViennaRNA.output_csv}
    - name: no_codons
      extra_features: ${ablate_features.output_dir}/no_codons.csv
      mfe_flag: --mfe ${runViennaRNA.output_csv}
    - name: seq_only
      extra_features: ''
      mfe_flag: ''
    do:
      cmd: >
        python scripts/train.py --params params.yaml  --model_name_or_path ${trainToFlyUTRs.output_dir}/best_checkpoint/
        --max_seq_length 512 --data_dir ${preprocessData.output_dir}  --output_dir
        ${fineTuneModel.output_dir}_${item.name}
        $(if [ -n "${item.extra_features}" ]; then echo "--extraFeatures ${item.extra_features}";
        fi)
        ${item.mfe_flag}
      deps:
      - scripts/train.py
      - scripts/GenaLMWithExtraFeatures.py
      - ${preprocessData.output_dir}
      - ${trainToFlyUTRs.output_dir}/best_checkpoint
      - ${getDecayResiduals.extraFeatures}
      - ${runViennaRNA.output_csv}
      - ${ablate_features.output_dir}/no_lengths.csv
      - ${ablate_features.output_dir}/no_gc_content.csv
      - ${ablate_features.output_dir}/no_codons.csv
      outs:
      - ${fineTuneModel.output_dir}_${item.name}:
          persist: true
      params:
      - fineTuneModel
      - modelParams

  predict:
    foreach:
    - name: _no_mfe
      extra_features: ${getDecayResiduals.extraFeatures}
      mfe_flag: ''
    - name: _no_lengths
      extra_features: ${ablate_features.output_dir}/no_lengths.csv
      mfe_flag: --mfe ${runViennaRNA.output_csv}
    - name: _no_gc_content
      extra_features: ${ablate_features.output_dir}/no_gc_content.csv
      mfe_flag: --mfe ${runViennaRNA.output_csv}
    - name: _no_codons
      extra_features: ${ablate_features.output_dir}/no_codons.csv
      mfe_flag: --mfe ${runViennaRNA.output_csv}
    - name: _seq_only
      extra_features: ''
      mfe_flag: ''
    - name: ''
      extra_features: ${getDecayResiduals.extraFeatures}
      mfe_flag: --mfe ${runViennaRNA.output_csv}
    do:
      cmd: python scripts/predict.py --params params.yaml --model_name_or_path ${fineTuneModel.output_dir}${item.name}/best_spearmanr/
        --data_dir ${preprocessData.output_dir} --output_dir ${predict.output_dir}${item.name}
        --scaler ${fineTuneModel.output_dir}${item.name}/best_spearmanr/scaler.joblib
        $( if [ -n "${item.name}" ]; then echo "--label ${item.name}"; fi) $(if [
        -n "${item.extra_features}" ]; then echo "--extraFeatures ${item.extra_features}";
        fi) ${item.mfe_flag}
      deps:
      - scripts/predict.py
      - ${preprocessData.output_dir}
      - ${fineTuneModel.output_dir}${item.name}/best_spearmanr
      outs:
      - ${predict.output_dir}${item.name}
      params:
      - predict
      - modelParams

  importanceAnalysis:
    cmd: python scripts/importanceAnalysis.py --params params.yaml --model_name_or_path
      ${fineTuneModel.output_dir}/best_spearmanr/ --save_path ${importanceAnalysis.output_dir}/${importanceAnalysis.pickle_file}
      --extraFeatures ${getDecayResiduals.extraFeatures} --sequence_file ${preprocessData.output_dir}/train.fasta
      --mfe ${runViennaRNA.output_csv}                                                                                                             #test.fasta
    deps:
    - scripts/importanceAnalysis.py
    - ${fineTuneModel.output_dir}
    outs:
    - ${importanceAnalysis.output_dir}/${importanceAnalysis.pickle_file}
    params:
    - importanceAnalysis

  visualizeImportance:
    cmd: python scripts/visualizeImportance.py --params params.yaml --kmer ${preprocessData.kmer}
      --SHAP ${importanceAnalysis.output_dir}/${importanceAnalysis.pickle_file} --scoresOnly
      ${importanceAnalysis.output_dir}/${visualizeImportance.scoresOnly} --save_path
      ${importanceAnalysis.output_dir}/${visualizeImportance.save_path} --save_tokenized_path
      ${importanceAnalysis.output_dir}/${visualizeImportance.save_tokenized_path}
    deps:
    - scripts/visualizeImportance.py
    - ${importanceAnalysis.output_dir}/${importanceAnalysis.pickle_file}
    outs:
    # - ${importanceAnalysis.output_dir}/${visualizeImportance.scoresOnly}
    - ${importanceAnalysis.output_dir}/${visualizeImportance.save_path}
    params:
    - visualizeImportance

  findMotifs:
    cmd: python scripts/find_motifs.py --SHAP ${importanceAnalysis.output_dir}/${importanceAnalysis.pickle_file}
      --save_file_dir ${findMotifs.output_dir}
    deps:
    - scripts/find_motifs.py
    - ${importanceAnalysis.output_dir}/${visualizeImportance.save_path}
    outs:
    - ${findMotifs.output_dir}/positive/${findMotifs.motif_file}
    - ${findMotifs.output_dir}/positive/${findMotifs.control_file}
    - ${findMotifs.output_dir}/positive/${findMotifs.motif_positions}
    - ${findMotifs.output_dir}/positive/${findMotifs.control_positions}
    - ${findMotifs.output_dir}/negative/${findMotifs.motif_file}
    - ${findMotifs.output_dir}/negative/${findMotifs.control_file}
    - ${findMotifs.output_dir}/negative/${findMotifs.motif_positions}
    - ${findMotifs.output_dir}/negative/${findMotifs.control_positions}
    params:
    - findMotifs

  runMASTFilter:
    cmd: head ${prepForMAST.output_fasta} -n 10 > /tmp/train.fasta && singularity
      exec -B /tmp/train.fasta docker://memesuite/memesuite:5.5.7 mast -oc ${runMASTFilter.output_dir}
      -remcorr 
      /opt/meme/share/meme-5.5.7/db/motif_databases/RNA/Ray2013_rbp_Drosophila_melanogaster.meme
      /tmp/train.fasta
    outs:
    - ${runMASTFilter.output_dir}/mast.txt
    params:
    - runMASTFilter

  motifsToKeep:
    cmd: python scripts/motifsToKeep.py --input ${runMASTFilter.output_dir}/mast.txt
      --output ${runMASTFilter.output_dir}/${motifsToKeep.output_file}
    deps:
    - scripts/motifsToKeep.py
    - ${runMASTFilter.output_dir}/mast.txt
    outs:
    - ${runMASTFilter.output_dir}/${motifsToKeep.output_file}
    params:
    - motifsToKeep

  runAME:
    foreach:
    - positive
    - negative
    do:
      cmd: singularity exec -B $(readlink 
        ${findMotifs.output_dir}/${item}/${findMotifs.control_file}):/tmp/${findMotifs.control_file}
        -B $(readlink 
        ${findMotifs.output_dir}/${item}/${findMotifs.motif_file}):/tmp/${findMotifs.motif_file}
        docker://memesuite/memesuite:5.5.7 ame $( cat ${runMASTFilter.output_dir}/${motifsToKeep.output_file})
        --oc ${findMotifs.output_dir}/${item}/${runAME.output_dir} --control /tmp/${findMotifs.control_file}
        --evalue-report-threshold 100 --method fisher --rna /tmp/${findMotifs.motif_file}
        /opt/meme/share/meme-5.5.7/db/motif_databases/RNA/Ray2013_rbp_Drosophila_melanogaster.meme
      outs:
      - ${findMotifs.output_dir}/${item}/${runAME.output_dir}
      deps:
      - ${runMASTFilter.output_dir}/${motifsToKeep.output_file}
      - ${findMotifs.output_dir}/${item}/${findMotifs.control_file}
      - ${findMotifs.output_dir}/${item}/${findMotifs.motif_file}
      params:
      - runAME

  downloadMicroRNAData:
    cmd: mkdir -p data/microRNA && wget -P data/microRNA 
      https://www.targetscan.org/fly_72/fly_72_data_download/Predicted_Targets_Info.default_predictions.txt.zip
      && unzip data/microRNA/Predicted_Targets_Info.default_predictions.txt.zip -d
      data/microRNA
    outs:
    - data/microRNA/Predicted_Targets_Info.default_predictions.txt

  microRNABindingEnrichment:
    foreach:
    - positive
    - negative
    do:
      cmd: python scripts/microRNABindingEnrichment.py --params params.yaml --control_file
        ${findMotifs.output_dir}/${item}/${findMotifs.control_positions} --interest_file
        ${findMotifs.output_dir}/${item}/${findMotifs.motif_positions} --output_dir
        ${microRNABindingEnrichment.output_dir}/${item} --mirna_file ${microRNABindingEnrichment.mirna_file}
      deps:
      - scripts/microRNABindingEnrichment.py
      - ${findMotifs.output_dir}/${item}/${findMotifs.control_positions}
      - ${findMotifs.output_dir}/${item}/${findMotifs.motif_positions}
      outs:
      - ${microRNABindingEnrichment.output_dir}/${item}/${microRNABindingEnrichment.control_overlap_file}
      - ${microRNABindingEnrichment.output_dir}/${item}/${microRNABindingEnrichment.interest_overlap_file}
      - ${microRNABindingEnrichment.output_dir}/${item}/${microRNABindingEnrichment.fisher_file}
      params:
      - microRNABindingEnrichment

  microRNABindingEnrichment_posVSneg:
    cmd: python scripts/microRNABindingEnrichment.py --params params.yaml --control_file
      ${findMotifs.output_dir}/negative/${findMotifs.motif_positions} --interest_file
      ${findMotifs.output_dir}/positive/${findMotifs.motif_positions} --output_dir
      ${microRNABindingEnrichment.output_dir}/positiveVSnegative --mirna_file ${microRNABindingEnrichment.mirna_file}
    deps:
    - scripts/microRNABindingEnrichment.py
    - ${findMotifs.output_dir}/negative/${findMotifs.motif_positions}
    - ${findMotifs.output_dir}/positive/${findMotifs.motif_positions}
    outs:
    - ${microRNABindingEnrichment.output_dir}/positiveVSnegative/${microRNABindingEnrichment.control_overlap_file}
    - ${microRNABindingEnrichment.output_dir}/positiveVSnegative/${microRNABindingEnrichment.interest_overlap_file}
    - ${microRNABindingEnrichment.output_dir}/positiveVSnegative/${microRNABindingEnrichment.fisher_file}
    params:
    - microRNABindingEnrichment
  # correctAME_pvalues:
  #   foreach:
  #     - positive
  #     - negative
  #   do:
  #     cmd: python scripts/correctAME_pvalues.py --params params.yaml 
  #       --ame_input ${findMotifs.output_dir}/${item}/${runAME.output_dir}/ame.tsv 
  #       --motif_seqs ${findMotifs.output_dir}/${item}/${findMotifs.motif_file} 
  #       --control_seqs ${findMotifs.output_dir}/${item}/${findMotifs.control_file} 
  #       --ame_corrected ${findMotifs.output_dir}/${item}/${correctAME_pvalues.output_file}

  #     deps:
  #     - scripts/correctAME_pvalues.py
  #     - ${findMotifs.output_dir}/${item}/${runAME.output_dir}/ame.tsv
  #     outs:
  #     - ${findMotifs.output_dir}/${item}/${correctAME_pvalues.output_file}
  #     params:
  #     - correctAME_pvalues

  prepRandomizeSeqsAndExtraFeatures:
    foreach:
    - seqImpact
    - extraFeatImpact
    - 5UTRImpact
    - 3UTRImpact
    do:
      cmd: python scripts/prepRandomizeSeqsAndExtraFeatures.py --params params.yaml
        --sequence_file ${preprocessData.output_dir}/train.fasta --process ${item}
        --output_file ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta
        --importance ${importanceAnalysis.output_dir}/${importanceAnalysis.pickle_file}
      deps:
      - scripts/prepRandomizeSeqsAndExtraFeatures.py
      - ${preprocessData.output_dir}/train.fasta
      - ${importanceAnalysis.output_dir}/${importanceAnalysis.pickle_file}
      outs:
      - ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta
      params:
      - prepRandomizeSeqsAndExtraFeatures

  randomizeSeqsAndExtraFeatures:
    foreach:
    - seqImpact
    - extraFeatImpact
    - 5UTRImpact
    - 3UTRImpact
    do:
      cmd: python scripts/sanityCheck_predictions.py --params params.yaml --sequence_file
        ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta --save_path
        ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}_predictions.csv
        --extraFeatures ${getDecayResiduals.extraFeatures} --mfe ${runViennaRNA.output_csv}                                                          #test.fasta
      deps:
      - scripts/sanityCheck_predictions.py
      - ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta
      outs:
      - ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}_predictions.csv
      params:
      - randomizeSeqsAndExtraFeatures

  splitHighLowDecay:
    foreach:
    - input: ${mergeUTRsAndDecayRates.output_file}
      label: all
    - input: ${preprocessData.output_dir}/train.fasta
      label: train
    do:
      cmd: python scripts/splitHighLowDecay.py --params params.yaml --input ${item.input}
        --high ${item.label}_${splitHighLowDecay.high} --low ${item.label}_${splitHighLowDecay.low}                                                                                   #${mergeUTRsAndDecayRates.output_file} #${preprocessData.output_dir}/test.fasta
      deps:
      - scripts/splitHighLowDecay.py
      - ${item.input} #${mergeUTRsAndDecayRates.output_file} #${preprocessData.output_dir}/test.fasta
      outs:
      - ${splitHighLowDecay.output}/${item.label}_${splitHighLowDecay.high}
      - ${splitHighLowDecay.output}/${item.label}_${splitHighLowDecay.low}
      params:
      - splitHighLowDecay

  runAME_highLowDecay:
    foreach:
    - interest: high
      label: all
      control: ${splitHighLowDecay.output}/all_${splitHighLowDecay.low}
      rna: ${splitHighLowDecay.output}/all_${splitHighLowDecay.high}
    - interest: low
      label: all
      control: ${splitHighLowDecay.output}/all_${splitHighLowDecay.high}
      rna: ${splitHighLowDecay.output}/all_${splitHighLowDecay.low}
    - interest: high
      label: train
      control: ${splitHighLowDecay.output}/train_${splitHighLowDecay.low}
      rna: ${splitHighLowDecay.output}/train_${splitHighLowDecay.high}
    - interest: low
      label: train
      control: ${splitHighLowDecay.output}/train_${splitHighLowDecay.high}
      rna: ${splitHighLowDecay.output}/train_${splitHighLowDecay.low}
    do:
      cmd: mkdir -p ${splitHighLowDecay.output}/${item.interest}/${runAME_highLowDecay.output_dir}
        && singularity exec -B $(readlink ${item.control}):/tmp/control.fasta -B $(readlink
        ${item.rna}):/tmp/rna.fasta docker://memesuite/memesuite:5.5.7 ame $( cat
        ${runMASTFilter.output_dir}/${motifsToKeep.output_file}) --oc 
        ${splitHighLowDecay.output}/${item.interest}/${item.label}_${runAME_highLowDecay.output_dir}
        --control /tmp/control.fasta --evalue-report-threshold 100 --method fisher
        --rna /tmp/rna.fasta 
        /opt/meme/share/meme-5.5.7/db/motif_databases/RNA/Ray2013_rbp_Drosophila_melanogaster.meme
      outs:
      - ${splitHighLowDecay.output}/${item.interest}/${item.label}_${runAME_highLowDecay.output_dir}
      deps:
      - ${splitHighLowDecay.output}/${item.label}_${splitHighLowDecay.low}
      - ${splitHighLowDecay.output}/${item.label}_${splitHighLowDecay.high}
      params:
      - runAME_highLowDecay

  runFIMO:
    cmd: singularity exec -B $(readlink 
      ${findMotifs.output_dir}/positive/${findMotifs.motif_file}):/tmp/motif_seqs.fasta
      docker://memesuite/memesuite:5.5.7 fimo --oc ${runFIMO.output_dir} --thresh
      ${runFIMO.fimo_pvalue_threshold} ${runFIMO.motif_file} /tmp/motif_seqs.fasta
    outs:
    - ${runFIMO.output_dir}
    deps:
    - ${findMotifs.output_dir}/positive/${findMotifs.motif_file}
    params:
    - runFIMO

  prepForMAST:
    cmd: python scripts/prepForMAST.py --input_fasta ${preprocessData.output_dir}/train.fasta
      --output_fasta ${prepForMAST.output_fasta}
    outs:
    - ${prepForMAST.output_fasta}
    deps:
    - scripts/prepForMAST.py
    - ${preprocessData.output_dir}/train.fasta
    params:
    - prepForMAST

  runTOMTOM:
    cmd: singularity exec -B $(readlink ${prepForMAST.output_fasta}):/tmp/train.fasta
      docker://memesuite/memesuite:5.5.7 tomtom -oc ${runTOMTOM.output_dir} -norc
      ${runTOMTOM.motif_file} ${runTOMTOM.motif_file}
    outs:
    - ${runTOMTOM.output_dir}
    deps:
    - ${prepForMAST.output_fasta}
    params:
    - runTOMTOM

  runMAST:
    cmd: mkdir -p ${runMAST.output_dir} && singularity exec -B $(readlink ${prepForMAST.output_fasta}):/tmp/train.fasta
      docker://memesuite/memesuite:5.5.7 mast -hit_list -remcorr -mt ${runMAST.mast_pvalue_threshold}
      ${runMAST.motif_file} /tmp/train.fasta > ${runMAST.output_dir}/${runMAST.output_file}
    outs:
    - ${runMAST.output_dir}
    deps:
    - ${prepForMAST.output_fasta}
    params:
    - runMAST

