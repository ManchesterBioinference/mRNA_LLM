stages:
  setupEnv:
    cmd: |
      conda env create --name ${setupEnv.name} -f environment.yaml
      echo "Conda environment '${setupEnv.name}' created and dependencies installed." >> setupEnv.log
    deps:
      - environment.yaml
    outs:
      - setupEnv.log
    params:
      - setupEnv

  downloadSpeciesData:
    cmd: conda run -n ${setupEnv.name} python scripts/downloadSpeciesData.py ${downloadSpeciesData.output_dir}
    deps:
    - scripts/downloadSpeciesData.py
    - setupEnv.log
    outs:
    - ${downloadSpeciesData.output_dir}
    params:
    - downloadSpeciesData

  isolate3UTRs:
    cmd: conda run -n ${setupEnv.name} python scripts/isolate3UTRs.py --params params.yaml --data_dir ${downloadSpeciesData.output_dir}
    deps:
    - scripts/isolate3UTRs.py
    - ${downloadSpeciesData.output_dir}
    outs:
    - ${isolate3UTRs.output_dir}
    params:
    - isolate3UTRs

  preprocessFlyUTRs:
    cmd: conda run -n ${setupEnv.name} python scripts/preprocessFlyUTRs.py --params params.yaml --data_dir ${isolate3UTRs.output_dir}
    deps:
    - scripts/preprocessFlyUTRs.py
    - ${isolate3UTRs.output_dir}
    outs:
    - ${preprocessFlyUTRs.output_dir} #output/data/flyUTRs
    params:
    - preprocessFlyUTRs

  trainToFlyUTRs:
    cmd: conda run -n ${setupEnv.name} python scripts/trainToFlyUTRs.py --params params.yaml --data_dir ${preprocessFlyUTRs.output_dir}
    deps:
    - scripts/trainToFlyUTRs.py
    - ${preprocessFlyUTRs.output_dir}
    outs:
    - ${trainToFlyUTRs.output_dir}/pytorch_model.bin
    - ${trainToFlyUTRs.output_dir}/checkpoints
    - ${trainToFlyUTRs.output_dir}/best_checkpoint
    params:
    - trainToFlyUTRs

  evaluateMLM:
    cmd: conda run -n ${setupEnv.name} python scripts/evaluate_mlm.py --params params.yaml
    deps:
    - scripts/evaluate_mlm.py
    - ${trainToFlyUTRs.output_dir}/best_checkpoint
    - ${evaluateMLM.data_dir}/${evaluateMLM.split}
    metrics:
    - ${evaluateMLM.output_file}:
        cache: false
    params:
    - evaluateMLM

  mergeUTRsAndDecayRates:
    cmd: conda run -n ${setupEnv.name} python scripts/mergeUTRsAndDecayRates.py --params params.yaml --fasta ${preprocessFlyUTRs.output_dir}
      --gtf_file 
      ${downloadSpeciesData.output_dir}/Drosophila_melanogaster-GCA_000001215.4-2022_07-genes.gtf.gz
    deps:
    - scripts/mergeUTRsAndDecayRates.py
    - ${mergeUTRsAndDecayRates.decay_rates} #data/results_zygotic_tr_extended_filtered.csv
    - ${preprocessFlyUTRs.output_dir}
    outs:
    - ${mergeUTRsAndDecayRates.output_file} #output/data/utrDecayRates.fasta
    params:
    - mergeUTRsAndDecayRates

  isolateFullTranscripts:
    cmd: conda run -n ${setupEnv.name} python scripts/isolateFullTranscripts.py --params params.yaml --data_dir
      ${isolate3UTRs.output_dir} --target_ids_fasta ${mergeUTRsAndDecayRates.output_file}
    deps:
    - scripts/isolateFullTranscripts.py
    - ${mergeUTRsAndDecayRates.output_file}
    - ${downloadSpeciesData.output_dir}
    outs:
    - ${isolateFullTranscripts.output_file}
    params:
    - isolateFullTranscripts

  getDecayResiduals:
    cmd: conda run -n ${setupEnv.name} python scripts/getDecayResiduals.py --params params.yaml --decay_file ${mergeUTRsAndDecayRates.decay_rates}
      --utr_fasta ${mergeUTRsAndDecayRates.output_file} --CDS_fasta ${isolate3UTRs.output_dir}/Drosophila_melanogaster-cds.fa
    deps:
    - scripts/getDecayResiduals.py
    - ${isolate3UTRs.output_dir}/Drosophila_melanogaster-cds.fa
    - ${mergeUTRsAndDecayRates.output_file} #output/data/utrDecayRates.fasta
    outs:
    - ${getDecayResiduals.residuals}
    - ${getDecayResiduals.extraFeatures}
    params:
    - getDecayResiduals

  runViennaRNA:
    cmd: conda run -n ${setupEnv.name} python scripts/runViennaRNA.py --input_fasta ${isolateFullTranscripts.output_file}
      --output_csv ${runViennaRNA.output_csv} --RNAfold_path linearfold                                                                                                                                                                                                                                                                                                                                      #$( which RNAfold )
    deps:
    - scripts/runViennaRNA.py
    - ${isolateFullTranscripts.output_file} #output/data/utrDecayRates.fasta
    outs:
    - ${runViennaRNA.output_csv}
    params:
    - runViennaRNA

  preprocessData:
    cmd: conda run -n ${setupEnv.name} python scripts/preprocess.py --params params.yaml --data_dir ${mergeUTRsAndDecayRates.output_file}
      --ncbi_geneID_map ${preprocessFlyUTRs.ncbi_geneID_map} --geneID_flybase_map
      ${preprocessFlyUTRs.geneID_flybase_map}                                                                                                                                                                                   #${getDecayResiduals.residuals} #
    deps:
    - scripts/preprocess.py
    - ${mergeUTRsAndDecayRates.output_file} #${getDecayResiduals.residuals} #
    outs:
    - ${preprocessData.output_dir}
    params:
    - preprocessData
    - preprocessFlyUTRs

  rayTune:
    cmd: export RAY_PICKLE_VERBOSE_DEBUG=1 && conda run -n ${setupEnv.name} python scripts/train.py --params params.yaml
      --model_name_or_path ${trainToFlyUTRs.output_dir}/best_checkpoint/ --max_seq_length
      512 --data_dir ${preprocessData.output_dir} --extraFeatures ${getDecayResiduals.extraFeatures}
      --mfe ${runViennaRNA.output_csv} --use_ray_tune #--train_final_model
    deps:
    - scripts/train.py
    - scripts/GenaLMWithExtraFeatures.py
    - ${preprocessData.output_dir}
    - ${trainToFlyUTRs.output_dir}/best_checkpoint
    - ${getDecayResiduals.extraFeatures}
    - ${runViennaRNA.output_csv}
    outs:
    - ${rayTune.ray_tune_local_dir}/best_ray_tune_config.json:
        persist: true
    - ${rayTune.ray_tune_local_dir}/ray_tune_results.csv:
        persist: true
    # - ${preprocessData.output_dir}_cache
    params:
    - fineTuneModel
    - modelParams
    - rayTune

  run_fineTuneModel:
    cmd: export RAY_PICKLE_VERBOSE_DEBUG=1 && conda run -n ${setupEnv.name} python scripts/train.py --params params.yaml
      --model_name_or_path ${trainToFlyUTRs.output_dir}/best_checkpoint/ --max_seq_length
      512 --data_dir ${preprocessData.output_dir} --extraFeatures ${getDecayResiduals.extraFeatures}
      --mfe ${runViennaRNA.output_csv}
    deps:
    - scripts/train.py
    - scripts/GenaLMWithExtraFeatures.py
    - ${preprocessData.output_dir}
    - ${trainToFlyUTRs.output_dir}/best_checkpoint
    - ${getDecayResiduals.extraFeatures}
    - ${runViennaRNA.output_csv}
    - ${rayTune.ray_tune_local_dir}
    outs:
    - ${fineTuneModel.output_dir}:
        persist: true
    # - ${preprocessData.output_dir}_cache
    params:
    - fineTuneModel
    - modelParams
    - rayTune

  ablate_features:
    foreach:
    - name: lengths
      ablate_flags: --ablate_lengths
    - name: gc_content
      ablate_flags: --ablate_gc_content
    - name: codons
      ablate_flags: --ablate_codons
    - name: lengths_gc
      ablate_flags: --ablate_lengths --ablate_gc_content
    do:
      cmd: >
        conda run -n ${setupEnv.name} python scripts/ablate_features.py --input_file ${getDecayResiduals.extraFeatures}
        --output_file ${ablate_features.output_dir}/no_${item.name}.csv
        ${item.ablate_flags}
      deps:
      - scripts/ablate_features.py
      - ${getDecayResiduals.extraFeatures}
      outs:
      - ${ablate_features.output_dir}/no_${item.name}.csv
      params:
      - ablate_features

  rayTune_ablations: #fineTuneModel_ablations:
    foreach:
      no_mfe:
        extra_features: ${getDecayResiduals.extraFeatures}
        mfe_flag: ''
      no_lengths:
        extra_features: ${ablate_features.output_dir}/no_lengths.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
      no_gc_content:
        extra_features: ${ablate_features.output_dir}/no_gc_content.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
      no_codons:
        extra_features: ${ablate_features.output_dir}/no_codons.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
      seq_only:
        extra_features: scripts/train.py #none but can't have an empty string in the deps
        mfe_flag: ''
      only_codons:
        extra_features: ${ablate_features.output_dir}/no_lengths_gc.csv
        mfe_flag: ''
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/train.py --params params.yaml  --model_name_or_path ${trainToFlyUTRs.output_dir}/best_checkpoint/
        --max_seq_length 512 --data_dir ${preprocessData.output_dir}  --output_dir
        ${fineTuneModel.output_dir}_${key} --ray_tune_local_dir output/ray_ablations/${key}
        $( if [ "${item.extra_features}" != "scripts/train.py" ]; then echo "--extraFeatures
        ${item.extra_features}"; fi ) ${item.mfe_flag} --use_ray_tune --runName ${key}
      deps:
      - scripts/train.py
      - scripts/GenaLMWithExtraFeatures.py
      - ${preprocessData.output_dir}
      - ${trainToFlyUTRs.output_dir}/best_checkpoint
      - ${getDecayResiduals.extraFeatures}
      - ${runViennaRNA.output_csv}
      - ${item.extra_features}
      outs:
      - output/ray_ablations/${key}/best_ray_tune_config.json:
          persist: true
      - output/ray_ablations/${key}/ray_tune_results.csv:
          persist: true
      params:
      - fineTuneModel
      - modelParams
      - rayTune

  run_fineTuneModel_ablations:
    foreach:
      no_mfe:
        extra_features: ${getDecayResiduals.extraFeatures}
        mfe_flag: ''
      no_lengths:
        extra_features: ${ablate_features.output_dir}/no_lengths.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
      no_gc_content:
        extra_features: ${ablate_features.output_dir}/no_gc_content.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
      no_codons:
        extra_features: ${ablate_features.output_dir}/no_codons.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
      seq_only:
        extra_features: scripts/train.py #none but can't have an empty string in the deps
        mfe_flag: ''
      only_codons:
        extra_features: ${ablate_features.output_dir}/no_lengths_gc.csv
        mfe_flag: ''
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/train.py --params params.yaml  --model_name_or_path ${trainToFlyUTRs.output_dir}/best_checkpoint/
        --max_seq_length 512 --data_dir ${preprocessData.output_dir}  --output_dir
        ${fineTuneModel.output_dir}_${key} --ray_tune_local_dir output/ray_ablations/${key}
        $( if [ "${item.extra_features}" != "scripts/train.py" ]; then echo "--extraFeatures
        ${item.extra_features}"; fi ) ${item.mfe_flag} --runName ${key}
      deps:
      - scripts/train.py
      - scripts/GenaLMWithExtraFeatures.py
      - ${preprocessData.output_dir}
      - ${trainToFlyUTRs.output_dir}/best_checkpoint
      - ${getDecayResiduals.extraFeatures}
      - ${runViennaRNA.output_csv}
      - ${item.extra_features}
      - output/ray_ablations/${key}/best_ray_tune_config.json
      outs:
      - ${fineTuneModel.output_dir}_${key}:
          persist: true
      params:
      - fineTuneModel
      - modelParams
      - rayTune

  predict:
    foreach:
      no_mfe:
        name: _no_mfe
        extra_features: ${getDecayResiduals.extraFeatures}
        mfe_flag: ''
        split: test
      no_lengths:
        name: _no_lengths
        extra_features: ${ablate_features.output_dir}/no_lengths.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
        split: test
      no_gc_content:
        name: _no_gc_content
        extra_features: ${ablate_features.output_dir}/no_gc_content.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
        split: test
      no_codons:
        name: _no_codons
        extra_features: ${ablate_features.output_dir}/no_codons.csv
        mfe_flag: --mfe ${runViennaRNA.output_csv}
        split: test
      only_codons:
        name: _only_codons
        extra_features: ${ablate_features.output_dir}/no_lengths_gc.csv
        mfe_flag: ''
        split: test
      seq_only:
        name: _seq_only
        extra_features: ''
        mfe_flag: ''
        split: test
      fullLLM:
        name: ''
        extra_features: ${getDecayResiduals.extraFeatures}
        mfe_flag: --mfe ${runViennaRNA.output_csv}
        split: test
      fullLLM_dev:
        name: ''
        extra_features: ${getDecayResiduals.extraFeatures}
        mfe_flag: --mfe ${runViennaRNA.output_csv}
        split: dev
      fullLLM_train:
        name: ''
        extra_features: ${getDecayResiduals.extraFeatures}
        mfe_flag: --mfe ${runViennaRNA.output_csv}
        split: train
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/predict.py --params params.yaml --model_name_or_path ${fineTuneModel.output_dir}${item.name}/best_spearmanr/
        --data_dir ${preprocessData.output_dir} --output_dir ${predict.output_dir}${item.name}
        --scaler ${fineTuneModel.output_dir}${item.name}/best_spearmanr/scaler.joblib
        --split ${item.split}
        $( if [ -n "${item.name}" ]; then echo "--label ${item.name}"; fi ) $( if
        [ -n "${item.extra_features}" ]; then echo "--extraFeatures ${item.extra_features}";
        fi ) ${item.mfe_flag}
      deps:
      - scripts/predict.py
      - ${preprocessData.output_dir}
      - ${fineTuneModel.output_dir}${item.name}/best_spearmanr
      outs:
      - ${predict.output_dir}${item.name}/${item.split}_predictions_vs_true_labels${item.name}.svg
      - ${predict.output_dir}${item.name}/${item.split}_predictions_vs_true_labels${item.name}.csv
      - ${predict.output_dir}${item.name}/${item.split}_results.json
      params:
      - predict
      - modelParams

  importanceAnalysis:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/importanceAnalysis.py --params params.yaml --model_name_or_path
        ${fineTuneModel.output_dir}/best_spearmanr/ --save_path ${importanceAnalysis.output_dir}/${item}_${importanceAnalysis.pickle_file}
        --extraFeatures ${getDecayResiduals.extraFeatures} --sequence_file ${preprocessData.output_dir}/${item}.fasta
        --mfe ${runViennaRNA.output_csv}                                                                                                             #test.fasta
      deps:
      - scripts/importanceAnalysis.py
      - ${fineTuneModel.output_dir}
      outs:
      - ${importanceAnalysis.output_dir}/${item}_${importanceAnalysis.pickle_file}
      params:
      - importanceAnalysis

  visualizeImportance:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/visualizeImportance.py --params params.yaml --kmer ${preprocessData.kmer}
        --SHAP ${importanceAnalysis.output_dir}/${item}_${importanceAnalysis.pickle_file}
        --scoresOnly ${importanceAnalysis.output_dir}/${item}_${visualizeImportance.scoresOnly}
        --save_path ${importanceAnalysis.output_dir}/${item}_${visualizeImportance.save_path}
        --save_tokenized_path 
        ${importanceAnalysis.output_dir}/${item}_${visualizeImportance.save_tokenized_path}
      deps:
      - scripts/visualizeImportance.py
      - ${importanceAnalysis.output_dir}/${item}_${importanceAnalysis.pickle_file}
      outs:
      # - ${importanceAnalysis.output_dir}/${visualizeImportance.scoresOnly}
      - ${importanceAnalysis.output_dir}/${item}_${visualizeImportance.save_path}:
          cache: false
          persist: true
      params:
      - visualizeImportance

  findMotifs:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/find_motifs.py --SHAP ${importanceAnalysis.output_dir}/${item}_${importanceAnalysis.pickle_file}
        --trainSHAP ${importanceAnalysis.output_dir}/train_${importanceAnalysis.pickle_file}
        --save_file_dir ${findMotifs.output_dir}/${item}
      deps:
      - scripts/find_motifs.py
      - ${importanceAnalysis.output_dir}/${item}_${visualizeImportance.save_path}
      outs:
      - ${findMotifs.output_dir}/${item}/positive/${findMotifs.motif_file}
      - ${findMotifs.output_dir}/${item}/positive/${findMotifs.control_file}
      - ${findMotifs.output_dir}/${item}/positive/${findMotifs.motif_positions}
      - ${findMotifs.output_dir}/${item}/positive/${findMotifs.control_positions}
      - ${findMotifs.output_dir}/${item}/negative/${findMotifs.motif_file}
      - ${findMotifs.output_dir}/${item}/negative/${findMotifs.control_file}
      - ${findMotifs.output_dir}/${item}/negative/${findMotifs.motif_positions}
      - ${findMotifs.output_dir}/${item}/negative/${findMotifs.control_positions}
      params:
      - findMotifs

  motifEnrichment:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/motifEnrichment.py --params params.yaml --name ${item} --motifLocations
        ${runMAST.output_dir}/${item}_${runMAST.output_file} --highSHAP ${findMotifs.output_dir}/${item}/positive/${findMotifs.motif_positions}
        --highControl ${findMotifs.output_dir}/${item}/positive/${findMotifs.control_positions}
        --lowSHAP ${findMotifs.output_dir}/${item}/negative/${findMotifs.motif_positions}
        --lowControl ${findMotifs.output_dir}/${item}/negative/${findMotifs.control_positions}
      deps:
      - scripts/motifEnrichment.py
      - ${findMotifs.output_dir}/${item}/positive/${findMotifs.motif_positions}
      - ${findMotifs.output_dir}/${item}/positive/${findMotifs.control_positions}
      - ${findMotifs.output_dir}/${item}/negative/${findMotifs.motif_positions}
      - ${findMotifs.output_dir}/${item}/negative/${findMotifs.control_positions}
      - ${runMAST.output_dir}/${item}_${runMAST.output_file}
      outs:
      - ${motifEnrichment.output_dir}/${item}_pos5_mannwhitneyu_results.csv:
          cache: false
          persist: true
      - ${motifEnrichment.output_dir}/${item}_pos3_mannwhitneyu_results.csv:
          cache: false
          persist: true
      - ${motifEnrichment.output_dir}/${item}_neg5_mannwhitneyu_results.csv:
          cache: false
          persist: true
      - ${motifEnrichment.output_dir}/${item}_neg3_mannwhitneyu_results.csv:
          cache: false
          persist: true
      params:
      - motifEnrichment


  prepRandomizeSeqsAndExtraFeatures:
    foreach:
    - seqImpact
    - extraFeatImpact
    - 5UTRImpact
    - 3UTRImpact
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/prepRandomizeSeqsAndExtraFeatures.py --params params.yaml
        --sequence_file ${preprocessData.output_dir}/${prepRandomizeSeqsAndExtraFeatures.seq_file}.fasta
        --process ${item} --output_file ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta
        --importance 
        ${importanceAnalysis.output_dir}/${prepRandomizeSeqsAndExtraFeatures.seq_file}_${importanceAnalysis.pickle_file}
      deps:
      - scripts/prepRandomizeSeqsAndExtraFeatures.py
      - ${importanceAnalysis.output_dir}/${prepRandomizeSeqsAndExtraFeatures.seq_file}_${importanceAnalysis.pickle_file}
      outs:
      - ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta
      params:
      - prepRandomizeSeqsAndExtraFeatures

  randomizeSeqsAndExtraFeatures:
    foreach:
    - seqImpact
    - extraFeatImpact
    - 5UTRImpact
    - 3UTRImpact
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/sanityCheck_predictions.py --params params.yaml --sequence_file
        ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta --save_path
        ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}_predictions.csv
        --extraFeatures ${getDecayResiduals.extraFeatures} --mfe ${runViennaRNA.output_csv}                                                          #test.fasta
      deps:
      - scripts/sanityCheck_predictions.py
      - ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}.fasta
      outs:
      - ${prepRandomizeSeqsAndExtraFeatures.sequence_dir}/${item}_predictions.csv
      params:
      - randomizeSeqsAndExtraFeatures

  splitHighLowDecay:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/splitHighLowDecay.py --params params.yaml --input ${preprocessData.output_dir}/${item}.fasta
        --high ${item}_${splitHighLowDecay.high} --low ${item}_${splitHighLowDecay.low}                                                                                   #${mergeUTRsAndDecayRates.output_file} #${preprocessData.output_dir}/test.fasta
      deps:
      - scripts/splitHighLowDecay.py
      - ${preprocessData.output_dir}/${item}.fasta
      outs:
      - ${splitHighLowDecay.output}/${item}_${splitHighLowDecay.high}
      - ${splitHighLowDecay.output}/${item}_${splitHighLowDecay.low}
      params:
      - splitHighLowDecay

  motifEnrichment_highLowDecay:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/motifEnrichment_highLow.py --params params.yaml --name ${item}
        --motifLocations ${runMAST.output_dir}/${item}_${runMAST.output_file} --highTE
        ${splitHighLowDecay.output}/${item}_${splitHighLowDecay.high} --lowTE ${splitHighLowDecay.output}/${item}_${splitHighLowDecay.low}
      deps:
      - scripts/motifEnrichment_highLow.py
      - ${splitHighLowDecay.output}/${item}_${splitHighLowDecay.high}
      - ${splitHighLowDecay.output}/${item}_${splitHighLowDecay.low}
      - ${runMAST.output_dir}/${item}_${runMAST.output_file}
      outs:
      - ${motifEnrichment.output_dir}/${item}_utr5_mannwhitneyu_results.csv:
          cache: false
          persist: true
      - ${motifEnrichment.output_dir}/${item}_utr3_mannwhitneyu_results.csv:
          cache: false
          persist: true
      params:
      - motifEnrichment_highLowDecay

  prepForMAST:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: conda run -n ${setupEnv.name} python scripts/prepForMAST.py --input_fasta ${preprocessData.output_dir}/${item}.fasta
        --output_fasta ${prepForMAST.output_dir}/${item}_${prepForMAST.output_fasta}
      outs:
      - ${prepForMAST.output_dir}/${item}_${prepForMAST.output_fasta}
      deps:
      - scripts/prepForMAST.py
      - ${preprocessData.output_dir}/${item}.fasta
      params:
      - prepForMAST

  getMASTBackgroundFile:
    cmd: singularity exec -B $(readlink ${preprocessData.output_dir}/train.fasta):/tmp/train.fasta
      docker://memesuite/memesuite:5.5.7 fasta-get-markov /tmp/train.fasta ${prepForMAST.output_dir}/${getMASTBackgroundFile.output_file}
    outs:
    - ${prepForMAST.output_dir}/${getMASTBackgroundFile.output_file}
    deps:
    - ${preprocessData.output_dir}/train.fasta
    params:
    - getMASTBackgroundFile

  runMAST:
    foreach:
    - train
    - dev
    - test
    do:
      cmd: mkdir -p ${runMAST.output_dir} && singularity exec -B $(readlink 
        ${prepForMAST.output_dir}/${item}_${prepForMAST.output_fasta}):/tmp/${item}.fasta
        -B $(readlink ${prepForMAST.output_dir}/${getMASTBackgroundFile.output_file}):/tmp/bfile.txt
        docker://memesuite/memesuite:5.5.7 mast -bfile /tmp/bfile.txt -hit_list -mt
        ${runMAST.mast_pvalue_threshold} ${runMAST.motif_file} /tmp/${item}.fasta
        > ${runMAST.output_dir}/${item}_${runMAST.output_file} && singularity exec
        -B $(readlink 
        ${prepForMAST.output_dir}/${item}_${prepForMAST.output_fasta}):/tmp/${item}.fasta
        -B $(readlink ${prepForMAST.output_dir}/${getMASTBackgroundFile.output_file}):/tmp/bfile.txt
        docker://memesuite/memesuite:5.5.7 mast -bfile /tmp/bfile.txt -oc ${runMAST.output_dir}/${item}
        -ev 10000 -mt ${runMAST.mast_pvalue_threshold} ${runMAST.motif_file} /tmp/${item}.fasta
      outs:
      - ${runMAST.output_dir}/${item}_${runMAST.output_file}
      deps:
      - ${prepForMAST.output_dir}/${item}_${prepForMAST.output_fasta}
      - ${prepForMAST.output_dir}/${getMASTBackgroundFile.output_file}
      params:
      - runMAST

  codonOnlyClassificationMLP:
